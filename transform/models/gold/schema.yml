version: 2

models:
    - name: mart_daily_revenue
      description: "Gold layer: daily revenue metrics per tenant. Main chart source."
      tests:
          - dbt_utils.unique_combination_of_columns:
                arguments:
                    combination_of_columns:
                        - tenant_id
                        - activity_date
      columns:
          - name: tenant_id
            tests:
                - not_null
                - accepted_values:
                      arguments:
                          values: ["brand_a", "brand_b"]
          - name: activity_date
            tests: [not_null]
          - name: total_net_sales
            tests:
                - dbt_utils.accepted_range:
                      arguments:
                          min_value: 0
          - name: total_refunds
            tests:
                - dbt_utils.accepted_range:
                      arguments:
                          min_value: 0

    - name: mart_customer_retention
      description: "Gold layer: new vs returning customers per tenant per day."
      tests:
          - dbt_utils.unique_combination_of_columns:
                arguments:
                    combination_of_columns:
                        - tenant_id
                        - activity_date
      columns:
          - name: tenant_id
            tests:
                - not_null
                - accepted_values:
                      arguments:
                          values: ["brand_a", "brand_b"]
          - name: activity_date
            tests: [not_null]
          - name: new_customers
            tests:
                - dbt_utils.accepted_range:
                      arguments:
                          min_value: 0
          - name: returning_customers
            tests:
                - dbt_utils.accepted_range:
                      arguments:
                          min_value: 0

    - name: mart_product_performance
      description: "Gold layer: per-SKU performance per tenant."
      tests:
          - dbt_utils.unique_combination_of_columns:
                arguments:
                    combination_of_columns:
                        - tenant_id
                        - product_id
      columns:
          - name: tenant_id
            tests:
                - not_null
                - accepted_values:
                      arguments:
                          values: ["brand_a", "brand_b"]
          - name: product_id
            tests: [not_null]
          - name: refund_rate
            tests:
                - dbt_utils.accepted_range:
                      arguments:
                          min_value: 0
                          max_value: 1
