[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-lakehouse-azure"
version = "0.1.0"
description = "Multi-tenant ecommerce KPI lakehouse on Azure Databricks: Delta, Unity Catalog, dbt, Terraform."
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Same version as .pre-commit-config.yaml: two ruff versions format differently.
    "ruff==0.16.9",
    "pre-commit>=3.7",
    "pyyaml>=6",
    "dbt-databricks>=1.10,<2",
    # Stay on dbt Core 1.x: 2.x is a new engine still in alpha.
    "dbt-core>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data_generator"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
