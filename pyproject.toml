[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-lakehouse-azure"
version = "0.1.0"
description = "Multi-tenant ecommerce KPI lakehouse on Azure Databricks: Delta, Unity Catalog, dbt, Terraform."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data_generator"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
